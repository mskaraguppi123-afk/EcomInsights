services:
  - type: web
    name: ecominsights
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && pip install -e ml"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./ecominsights.db
      - key: SERPAPI_API_KEY
        sync: false
