services:
  - type: web
    name: ecominsights
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && pip install -e ml"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./ecominsights.db
      - key: APIFY_API_TOKEN
        value: apify_api_ZrM2JpuYga2qej4jD7P4LUUxhQFu6y1YsGm3
      - key: APIFY_AMAZON_ACTOR
        value: junglee/amazon-crawler
      - key: APIFY_FLIPKART_ACTOR
        value: scrapesage/flipkart-scraper
      - key: SERPAPI_API_KEY
        sync: false
