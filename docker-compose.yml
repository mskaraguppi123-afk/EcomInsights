services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecominsights
      POSTGRES_USER: ecominsights
      POSTGRES_PASSWORD: ecominsights_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecominsights -d ecominsights"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
